# FLYWAY (FlywayProperties)
flyway.baseline-on-migrate=true
flyway.clean-on-validation-error=false
flyway.locations=filesystem:db/migration

# JPA
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.javax.persistence.validation.mode=none

# Swagger properties
cu.aica.api.v1.swagger.title=Product-Resource Api
cu.aica.api.v1.swagger.description=API that contains all endpoints of Product-Resource's microservices
cu.aica.api.v1.swagger.version=1.0
logging.level.io.swagger.models.parameters.AbstractSerializableParameter=error

spring.profiles.active=@activatedProperties@